<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SeamCast – Scoreboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="overlay.css">
  <link rel="stylesheet" href="tafel.css">
  <link rel="stylesheet" href="bild.css">
</head>
<body data-live="false" data-graphic="on" data-position="top-left">
  <div id="scoreboard">
    <div class="teams">
      <div class="row" id="row-away"><span class="name" id="name-away"></span><span class="score" id="score-away">0</span></div>
      <div class="row" id="row-home"><span class="name" id="name-home"></span><span class="score" id="score-home">0</span></div>
    </div>
    <div class="info">
      <div class="inning"><span id="half"></span> <span id="inning">1</span></div>
      <svg id="bases" viewBox="0 0 40 40" aria-hidden="true">
        <rect id="base-2" x="14" y="2" width="12" height="12"/>
        <rect id="base-3" x="2" y="14" width="12" height="12"/>
        <rect id="base-1" x="26" y="14" width="12" height="12"/>
      </svg>
      <div class="count" id="count">
        <div class="line"><span>B</span><span class="dots" id="balls"></span></div>
        <div class="line"><span>S</span><span class="dots" id="strikes"></span></div>
        <div class="line"><span id="out-label">OUT</span><span class="dots" id="outs"></span></div>
      </div>
      <div class="pitches" id="pitches"><span id="pitch-label">P</span><b id="pitch-count">0</b></div>
    </div>
  </div>
  <div id="tafel" aria-hidden="true">
    <div class="t-cell t-name" id="t-name-away"></div>
    <div class="t-cell t-score" id="t-score-away">0</div>
    <div class="t-cell t-field">
      <svg viewBox="0 0 60 60">
        <polygon class="t-grass" points="30,6 54,30 30,54 6,30"/>
        <circle class="t-mound" cx="30" cy="31" r="4"/>
        <rect class="t-base" id="t-base-2" x="24.5" y="0.5" width="11" height="11"/>
        <rect class="t-base" id="t-base-3" x="0.5" y="24.5" width="11" height="11"/>
        <rect class="t-base" id="t-base-1" x="48.5" y="24.5" width="11" height="11"/>
      </svg>
    </div>
    <div class="t-cell t-inning" id="t-inning"></div>
    <div class="t-cell t-pitch" id="t-pitch"></div>
    <div class="t-cell t-name" id="t-name-home"></div>
    <div class="t-cell t-score" id="t-score-home">0</div>
    <div class="t-cell t-count" id="t-count"></div>
    <div class="t-cell t-out" id="t-out"></div>
  </div>
  <div id="bild" aria-hidden="true">
    <img class="b-back" id="b-back" alt="">
    <svg class="b-bases" id="b-bases" viewBox="0 0 60 60">
      <polygon class="b-grass" points="30,6 54,30 30,54 6,30"/>
      <circle class="b-mound" cx="30" cy="31" r="4"/>
      <rect class="b-base" id="b-base-2" x="24.5" y="0.5" width="11" height="11"/>
      <rect class="b-base" id="b-base-3" x="0.5" y="24.5" width="11" height="11"/>
      <rect class="b-base" id="b-base-1" x="48.5" y="24.5" width="11" height="11"/>
    </svg>
    <div class="b-field" id="b-away"><span></span></div>
    <div class="b-field" id="b-awayScore"><span></span></div>
    <div class="b-field" id="b-home"><span></span></div>
    <div class="b-field" id="b-homeScore"><span></span></div>
    <div class="b-field" id="b-inning"><span></span></div>
    <div class="b-field" id="b-pitch"><span></span></div>
    <div class="b-field" id="b-count"><span></span></div>
    <div class="b-field" id="b-out"><span></span></div>
  </div>
  <script src="scoreboard.js"></script>
</body>
</html>
